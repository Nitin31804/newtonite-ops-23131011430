version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: always
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_secret
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://newtonite:newtonite_secret@postgres:5432/newtonite_ops
      JWT_SECRET: newtonite-production-secure-key-2026
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newtonite-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
