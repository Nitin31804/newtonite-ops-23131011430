version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newtonite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newtonite_secret}
      POSTGRES_DB: ${POSTGRES_DB:-newtonite_ops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newtonite} -d ${POSTGRES_DB:-newtonite_ops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite-backend
    restart: always
    environment:
      # Local Demonstration & Evaluator Configuration
      # NOTE: In production environments, set NODE_ENV=production, DEMO_MODE=false,
      # and ALLOW_DEMO_SEED=false, and inject strong random secrets via secrets management.
      NODE_ENV: ${NODE_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-newtonite}:${POSTGRES_PASSWORD:-newtonite_secret}@postgres:5432/${POSTGRES_DB:-newtonite_ops}}
      JWT_SECRET: ${JWT_SECRET:-newtonite-dev-evaluator-secret-2026}
      ALLOW_DEV_DEMO_AUTH: ${ALLOW_DEV_DEMO_AUTH:-false}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${DEMO_MODE:-true}
    container_name: newtonite-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
